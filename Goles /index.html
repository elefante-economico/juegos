<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goles</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <h1>⚽ GOLES</h1>

       <p><a href="../">← Todos los juegos</a></p>

    <p class="consigna">
        Cada casilla del arco tiene una operación. Su resultado es la probabilidad
        de gol (en %). Si supera el 50%, es gol; si no, el arquero ataja.
        ¡Elegí bien y rápido, antes de que se acabe el tiempo!
    </p>

    <div class="estadisticas">
        <p id="nivel"></p>
        <p id="goles"></p>
        <p id="vidas"></p>
        <p id="record"></p>
    </div>

    <p id="tiempo"></p>
    <div class="barra"><div id="barraTiempo"></div></div>

    <div class="campo">

        <div class="arco">

            <!-- Arquero -->
            <div id="arquero">
                <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="20" y="64" width="8" height="22" rx="3" fill="#f1c27d"/>
                    <rect x="32" y="64" width="8" height="22" rx="3" fill="#f1c27d"/>
                    <ellipse cx="24" cy="87" rx="7" ry="3" fill="#222"/>
                    <ellipse cx="36" cy="87" rx="7" ry="3" fill="#222"/>
                    <rect x="18" y="54" width="24" height="14" rx="4" fill="#222"/>
                    <line x1="18" y1="32" x2="5" y2="12" stroke="#ff8c00" stroke-width="9" stroke-linecap="round"/>
                    <line x1="42" y1="32" x2="55" y2="12" stroke="#ff8c00" stroke-width="9" stroke-linecap="round"/>
                    <rect x="16" y="26" width="28" height="32" rx="7" fill="#ff8c00"/>
                    <circle cx="30" cy="14" r="10" fill="#f1c27d"/>
                    <circle cx="5" cy="10" r="7" fill="#33cc66" stroke="#fff" stroke-width="2"/>
                    <circle cx="55" cy="10" r="7" fill="#33cc66" stroke="#fff" stroke-width="2"/>
                </svg>
            </div>

            <!-- Los 9 tiros se generan desde script.js -->
            <div id="tiros"></div>

        </div>

        <div class="area">
            <span id="pelota">⚽</span>
        </div>

    </div>

    <p id="mensaje"></p>

    <button id="btnSiguiente" onclick="siguiente()" hidden>Siguiente tiro ▶</button>
    <button id="btnNueva" onclick="nuevaPartida()">🔄 Nueva partida</button>

</div>

<script src="script.js"></script>

</body>
</html>
