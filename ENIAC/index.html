<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIAC</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <h1>ENIAC</h1>

    <p>La computadora ha transformado un número. Deshacé las operaciones para encontrar el número inicial.</p>

    <p id="nivel"></p>
    <p id="puntaje"></p>

    <h2 id="resultado"></h2>

    <div id="operaciones"></div>

    <br>

    <input
        type="number"
        id="respuesta"
        placeholder="Número inicial">

    <br><br>

    <button onclick="comprobar()">
        Comprobar
    </button>

    <p id="mensaje"></p>

</div>

<script src="script.js"></script>

</body>
</html>
