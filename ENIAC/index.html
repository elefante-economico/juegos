<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIAC</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <h1>GÁNALE A ENIAC</h1>

    <p>La computadora ha transformado un número. Deshacé las operaciones para encontrar el número inicial.</p>

    <div class="estadisticas">
        <p id="nivel"></p>
        <p id="puntaje"></p>
        <p id="record"></p>
        <p id="tiempo"></p>
    </div>

    <h2 id="resultado"></h2>

    <div id="operaciones"></div>

    <p id="pista"></p>

    <br>

    <input
        type="number"
        id="respuesta"
        placeholder="Número inicial">

    <br><br>

    <div class="botones">
        <button id="btnComprobar" onclick="comprobar()">Comprobar</button>
        <button id="btnPista" class="secundario" onclick="pedirPista()">💡 Pista</button>
    </div>

    <p id="mensaje"></p>

    <div class="botones">
        <button id="btnModo" class="secundario" onclick="alternarModo()"></button>
        <button id="btnNueva" class="secundario" onclick="nuevaPartida()">🔄 Nueva partida</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
